[package]
name = "thonk"
description = "Modern recreation of Audio Ease's classic Mac OS 9 granular synthesis artistic app Th0nk"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nagualcode/th0nk3000"
authors = ["Jardim Sonoro", "nagualcode", "Arjen van der Schoot", "=cw4t7abs (antiorp)"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "thonk-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "thonk-render"
path = "src/bin/thonk_render.rs"

[features]
default = ["clap", "vst3", "au", "standalone-playback"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
vst2 = ["dep:truce-vst2"]
lv2 = ["dep:truce-lv2"]
aax = ["dep:truce-aax"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
standalone-playback = ["standalone", "truce-standalone/playback"]
shell = ["truce/shell"]

[dependencies]
truce = { git = "https://github.com/truce-audio/truce" }
truce-core = { git = "https://github.com/truce-audio/truce" }
truce-params = { git = "https://github.com/truce-audio/truce" }
truce-clap = { git = "https://github.com/truce-audio/truce", optional = true }
truce-vst3 = { git = "https://github.com/truce-audio/truce", optional = true }
truce-vst2 = { git = "https://github.com/truce-audio/truce", optional = true }
truce-aax = { git = "https://github.com/truce-audio/truce", optional = true }
truce-au = { git = "https://github.com/truce-audio/truce", optional = true }
truce-lv2 = { git = "https://github.com/truce-audio/truce", optional = true }
clap-sys = { version = "0.5", optional = true }
truce-standalone = { git = "https://github.com/truce-audio/truce", features = ["gui"], optional = true }
truce-font = { git = "https://github.com/truce-audio/truce" }
truce-loader = { git = "https://github.com/truce-audio/truce" }
truce-egui = { git = "https://github.com/truce-audio/truce" }
egui = "0.34"
hound = "3.5"
rfd = "0.15"

[dev-dependencies]
truce-test = { git = "https://github.com/truce-audio/truce" }
